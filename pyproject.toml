[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discussion-system"
version = "0.1.0"
description = "商談音声解析・法人カルテ自動生成システム"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Tabelog Sales Team", email = "souta55908@gmail.com"}
]

dependencies = [
    "typer[all]==0.12.3",
    "pydantic==2.6.0",
    "pydantic-settings==2.2.0",
    "python-dotenv==1.0.0",
    "openai-whisper==20240314",
    "anthropic==0.28.0",
    "sqlalchemy==2.0.25",
    "pytest==7.4.4",
    "pytest-asyncio==0.23.2",
]

[project.optional-dependencies]
dev = [
    "black==24.1.1",
    "ruff==0.2.2",
    "mypy==1.8.0",
    "pytest-cov==4.1.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
