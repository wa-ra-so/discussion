app = "discussion-api"
primary_region = "nrt"

[build]

[env]
  PYTHONUNBUFFERED = "true"
  WHISPER_MODEL = "base"
  # CORS の Origin にはパスを含めない（スキーム+ホストのみ）。
  # GitHub Pages のプロジェクトページは https://<owner>.github.io がオリジンになる
  # （配信パスが /discussion/ でも Origin ヘッダー自体はリポジトリ名を含まない）。
  CORS_ORIGINS = "https://wa-ra-so.github.io"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "discussion_data"
  destination = "/app/data"
